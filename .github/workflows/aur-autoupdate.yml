name: AUR Auto Update

on:
  workflow_dispatch:
    inputs:
      force_aur_push:
        description: Push current package state to AUR even when no update is detected
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Install metadata tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends jq

      - name: Update pkgver/source from upstream
        id: metadata
        run: |
          bash scripts/update_pkgbuild_metadata.sh .

          if git diff --quiet -- PKGBUILD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update checksums and .SRCINFO
        if: ${{ steps.metadata.outputs.changed == 'true' }}
        uses: heyhusen/archlinux-package-action@v3.0.1
        with:
          flags: ''
          namcap: false
          updpkgsums: true
          srcinfo: true
          update_archlinux_keyring: true

      - name: Configure git
        if: ${{ steps.metadata.outputs.changed == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit changes
        id: commit
        if: ${{ steps.metadata.outputs.changed == 'true' }}
        run: |
          git add PKGBUILD .SRCINFO .gitignore

          if git diff --cached --quiet; then
            echo "No update needed."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ver=$(grep -E '^pkgver=' PKGBUILD | cut -d= -f2)
          git commit -m "Update to ${ver}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Push back to GitHub
        if: ${{ steps.commit.outputs.changed == 'true' }}
        run: |
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Push to AUR
        if: ${{ steps.commit.outputs.changed == 'true' || inputs.force_aur_push == true }}
        env:
          AUR_REPO: ${{ secrets.AUR_REPO }}
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [[ -z "${AUR_REPO}" || -z "${AUR_SSH_PRIVATE_KEY}" ]]; then
            echo "AUR secrets not set; skipping AUR push."
            exit 0
          fi
          bash scripts/aur_push_aur.sh . master
